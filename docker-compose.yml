services:
  db:
    image: pgvector/pgvector:pg16
    container_name: devpilot-postgres

    environment:
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: postgre
      POSTGRES_DB: postgre

    ports:
      - "55432:5432"

    volumes:
      - devpilot_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpilot -d postgre"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devpilot_pg_data: