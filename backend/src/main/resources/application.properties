

# APPLICATION

spring.application.name=backend



# DATABASE - NEON POSTGRESQL

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/postgre}
spring.datasource.username=${DB_USERNAME:devpilot}
spring.datasource.password=${DB_PASSWORD:postgre}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false



# ENCRYPTION

app.encryption.password=${ENCRYPTION_PASSWORD:devpilot-local-encryption-password}
app.encryption.salt=${ENCRYPTION_SALT:7de9c36fca865b71be817a04f98dbab6}

app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:devpilot-local-token-encryptor-password}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:e9b0e4d3c060319d99ea9bae4695aae8}



# NVIDIA NIM - SHARED API KEY


spring.ai.openai.api-key=${NVIDIA_API_KEY}


# NVIDIA CHAT MODEL


spring.ai.openai.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com}

spring.ai.openai.chat.model=${NVIDIA_MODEL:nvidia/nemotron-3-ultra-550b-a55b}
spring.ai.openai.chat.max-tokens=4096


# NVIDIA EMBEDDING MODEL
# IMPORTANT: Embedding URL MUST include /v1


spring.ai.openai.embedding.base-url=${NVIDIA_EMBEDDING_BASE_URL:https://integrate.api.nvidia.com/v1}

spring.ai.openai.embedding.model=${NVIDIA_EMBEDDING_MODEL:nvidia/nemotron-3.5-embed-1b}
spring.ai.openai.embedding.dimensions=1536
spring.ai.openai.embedding.extra-body.input_type=passage
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE


# AI CLIENT SETTINGS


spring.ai.openai.timeout=300s
spring.ai.openai.max-retries=3

# GITHUB OAUTH2

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}

spring.security.oauth2.client.registration.github.scope[0]=read:user
spring.security.oauth2.client.registration.github.scope[1]=repo

spring.security.oauth2.client.registration.github.redirect-uri=${BACKEND_URL:http://localhost:8080}/login/oauth2/code/github

spring.security.oauth2.client.provider.github.user-name-attribute=id



# SESSION MANAGEMENT

server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=7d



# FRONTEND AND CORS

app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}



# CODE INDEXING

app.indexing.max-file-bytes=524288
app.indexing.chunk-size=2000
app.indexing.chunk-overlap=200



# RETRIEVAL AUGMENTED GENERATION (RAG)

app.rag.top-k-chunks=20
app.rag.stream-timeout-ms=180000



# GITHUB API

app.github.api-delay-ms=50
