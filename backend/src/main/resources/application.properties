spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/postgre}
spring.datasource.username=${DB_USERNAME:devpilot}
spring.datasource.password=${DB_PASSWORD:postgre}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.encryption.password=${ENCRYPTION_PASSWORD:devpilot-local-encryption-password}
app.encryption.salt=${ENCRYPTION_SALT:0123456789abcdef}

# NVIDIA NIM exposes an OpenAI-compatible chat completions API.
# Keep the credential outside source control.
spring.ai.openai.api-key=${NVIDIA_API_KEY:}
spring.ai.openai.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
spring.ai.openai.chat.model=${NVIDIA_MODEL:meta/llama-3.1-8b-instruct}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:devpilot-local-token-encryptor-password}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50
